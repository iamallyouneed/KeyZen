[workspace]
members = [
    "crates/keyzen-core",
    "crates/keyzen-win",
]
default-members = ["crates/keyzen-win"]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows-sys = "0.61"
windows = "0.61"
